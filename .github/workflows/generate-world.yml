name: Generate AI Noir World Tiles
on:
  push:
    branches: [main]
    paths:
      - "tools/generate_world_tiles.py"
      - ".github/workflows/generate-world.yml"
  workflow_dispatch:
    inputs:
      start:
        description: First world tile index
        required: true
        default: "0"
        type: string
      count:
        description: Number of new tiles (1-8)
        required: true
        default: "4"
        type: string
permissions:
  contents: write
concurrency:
  group: sudio-ai-world-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub pillow
      - name: Generate photorealistic city tiles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START: ${{ inputs.start || '0' }}
          COUNT: ${{ inputs.count || '4' }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is missing in this workflow run. No AI images were generated. Check that the secret is named HF_TOKEN in iojh2021-oss/Sudio > Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          python tools/generate_world_tiles.py --start "$START" --count "$COUNT"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          manifest = json.loads(Path("generated-world/manifest.json").read_text())
          tiles = manifest.get("tiles", [])
          if len(tiles) < 1:
              raise SystemExit("Image generation returned no tiles.")
          for tile in tiles:
              path = Path("generated-world") / tile["file"]
              if not path.is_file():
                  raise SystemExit(f"Missing generated image: {path}")
              with Image.open(path) as image:
                  if image.format != "WEBP" or image.size != (1024, 576):
                      raise SystemExit(f"Invalid generated image: {path}")
              if not tile.get("sha256"):
                  raise SystemExit(f"Missing SHA-256 for {path}")
          print(f"Verified {len(tiles)} generated AI image(s).")
          PY
      - name: Commit generated tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-world/
          git commit -m "Generate AI noir world tiles" || echo "No new tiles to commit"
          git push
