name: Generate AI Noir World Tiles
on:
  workflow_dispatch:
    inputs:
      start:
        description: First world tile index
        required: true
        default: "0"
        type: string
      count:
        description: Number of new tiles (1-8)
        required: true
        default: "4"
        type: string
permissions:
  contents: write
concurrency:
  group: sudio-ai-world-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub pillow
      - name: Generate photorealistic city tiles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
        run: python tools/generate_world_tiles.py --start "$START" --count "$COUNT"
      - name: Commit generated tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-world/
          git commit -m "Generate AI noir world tiles" || echo "No new tiles to commit"
          git push
