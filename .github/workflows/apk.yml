name: Sudio APK
# ساخت APK اندروید (بستهٔ Capacitor دور صفحهٔ وب). اجرا: تب Actions ← «Sudio APK» ← Run workflow
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Syntax check and tests
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          npm test
      - name: Assemble web assets
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js src icons www/
      - name: Capacitor Android project
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sudio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Sudio.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Sudio.apk --title "Sudio APK" --notes "Debug APK built by GitHub Actions from commit ${GITHUB_SHA::7}" --latest=false
