name: Deploy Sudio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate studio HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          ids = re.findall(r"\bid=['\"]([^'\"]+)['\"]", html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))
          tags = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I)
          scripts = []
          for attrs, body in tags:
              if re.search(r"\bsrc\s*=", attrs, re.I) or not body.strip():
                  continue
              is_module = re.search(r"""type\s*=\s*["']module["']""", attrs, re.I)
              suffix = ".mjs" if is_module else ".js"
              path = Path(f"/tmp/sudio-inline-{len(scripts)}{suffix}")
              path.write_text(body, encoding="utf-8")
              scripts.append(path)
          if not scripts:
              raise SystemExit("No inline scripts found")
          required = ["cameraZoom", "cameraOffset", "openbonePlayer", "saveProject", "loadProject", "world-engine.js", "worldSeed", "worldRegenerate", "worldStatus"]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing required studio controls: " + ", ".join(missing))
          print(f"Validated {len(ids)} unique ids and {len(scripts)} inline scripts")
          PY
          node --check world-engine.js
          for script in /tmp/sudio-inline-*; do
            [ -f "$script" ] || continue
            node --check "$script"
          done
          node - <<'JS'
          const assert = require('node:assert/strict');
          const engine = require('./world-engine.js');
          const a = engine.makeChunk(77, 3, {mood:'noir'});
          const b = engine.makeChunk(77, 3, {mood:'noir'});
          assert.deepEqual(a, b, 'same seed and index must create identical chunks');
          assert.ok(a.buildings.length > 0, 'chunk must contain generated buildings');
          const landmark = engine.makeChunk(77, 0, {mood:'noir'});
          assert.ok(landmark.props.some(p => p.landmark && p.type === 'phonebooth'), 'landmark districts must include a persistent landmark');
          const world = engine.create({seed:77});
          const visible = world.getVisibleChunks(0, 1280);
          assert.ok(visible.length >= 2, 'camera window must preload neighboring chunks');
          assert.ok(world.stats().generated > 0, 'generation stats must increment');
          const nearby = world.getNearbyProps(480, 960);
          assert.ok(nearby.length > 0, 'nearby interaction query must return generated props');
          assert.ok(nearby.every(p => Number.isFinite(p.worldX) && Number.isFinite(p.distance)), 'nearby props must expose world coordinates and distance');
          const interaction = world.interactAt(480, 960);
          assert.equal(interaction.ok, true, 'nearby generated props must be interactable');
          assert.ok(typeof interaction.message === 'string' && interaction.message.length > 0, 'interaction must return a user-facing response');
          const collisionWorld = SudioWorld.create({seed: 20261119, mood: 'noir'});
          const obstacle = collisionWorld.getCollisionAt(480, 960);
          assert.ok(obstacle && obstacle.solid, 'solid generated props must be detectable as obstacles');
          collisionWorld.interactAt(obstacle.worldX, 0);
          assert.equal(collisionWorld.getCollisionAt(obstacle.worldX, 0), null, 'interacting with an obstacle must clear its collision');
          console.log('Live world engine tests passed');
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
